name: publish

# Tag a version and it goes to PyPI. Nothing else does - no manual build on somebody's laptop,
# no token pasted into a terminal, no "which machine did we release from".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same tests.yml the branch runs, called rather than copied. A release that skipped them
  # would be a release nobody checked, and a gate written as a second copy of the job is a gate
  # that drifts out of step with the first. That matrix also builds the wheel and asks the
  # installed command a question from a directory that is not the checkout.
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: GitHub mints a short-lived OIDC token that PyPI verifies against
      # this repository and this workflow file. There is no API token to store, leak, rotate,
      # or find in a repository secret two years from now.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the scrub below reads every commit message, so it needs them

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: nothing private, in the tree or in any commit message
        # An upload cannot be taken back and a public repository cannot be un-read. This is the
        # same check the suite runs on every commit, plus the half it cannot hold green there:
        # a commit message is fixed only by rewriting history, so it is checked here, at the
        # one moment where stopping still costs nothing.
        run: python tools/scrub.py --history

      - name: the tag has to match the version in pyproject.toml
        # Otherwise `git tag v0.1.1` on a tree that still says 0.1.0 uploads 0.1.0 again, PyPI
        # refuses it as a duplicate, and the failure arrives at the last possible moment.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $tag, pyproject $have"
          test "$tag" = "$have"

      - name: build from a clean tree
        # setuptools copies sources into build/lib and never removes anything from it, so a
        # file you deleted is still there and still goes into the wheel.
        run: |
          rm -rf build dist ./*.egg-info
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: the artifacts have to contain the tool and the command
        # This project is one module and one entry point. A wheel that has the metadata but
        # not the module installs perfectly and then does nothing.
        run: |
          python - <<'EOF'
          import glob, sys, tarfile, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          print("\n".join(sorted(names)))
          if "codegraph.py" not in names:
              sys.exit("the wheel does not contain codegraph.py")
          entry = [n for n in names if n.endswith("entry_points.txt")]
          if not entry or "codegraph" not in zipfile.ZipFile(whl).read(entry[0]).decode():
              sys.exit("the wheel declares no codegraph command")
          sdist = glob.glob("dist/*.tar.gz")[0]
          inside = tarfile.open(sdist).getnames()
          for want in ("codegraph.py", "LICENSE", "README.md"):
              if not any(n.endswith("/" + want) for n in inside):
                  sys.exit(f"the sdist is missing {want}")
          print("wheel and sdist both carry the tool")
          EOF

      - name: upload to PyPI
        # Pinned to a commit, not to `release/v1`. That ref is a BRANCH: whatever it points at
        # is what runs, and this is the one job in the repository holding `id-token: write` -
        # the permission that mints a PyPI credential. A moving ref here is a third party with
        # standing permission to publish under this name. (Currently v1.14.2.)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
