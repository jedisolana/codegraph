name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  PYTHONUTF8: "1"

# Without this a workflow inherits whatever the repository default token is, which on many
# repositories is write. These jobs check out the code and run tests; reading is all they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three again, now that this repository is public and runners are free. They came
        # out for a while when it was private: a mac runner bills at TEN times a linux one, and
        # measured here the three mac jobs were 30 of a push's 42 charged minutes. That saving
        # only ever made sense against an allowance.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install - it is the standard library and nothing else.
      - name: lint
        run: |
          pip install ruff
          ruff check .
      - name: the built-in selftest, with leaked file handles made fatal
        run: python -W error::ResourceWarning codegraph.py --selftest
      - name: the test suite
        run: python -m unittest discover -s tests -v
      - name: it can read its own source
        run: |
          python codegraph.py build .
          # A QUALIFIED name, because the tests define a nested `build` of their own and the
          # bare one is genuinely ambiguous - this step used to fail with the tool being right.
          python codegraph.py impact codegraph.build
          python codegraph.py callers codegraph._defs_and_calls
          python codegraph.py stats

  # The file is meant to be copied into a repo, and it is also meant to install. Those are two
  # different things, and only one of them is covered by running the tests from a checkout:
  # `pip install` has to produce a `codegraph` command that works from a directory that is not
  # this one.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build a wheel from a clean tree
        run: |
          rm -rf build dist ./*.egg-info
          pip install build
          python -m build --wheel
      - name: install it somewhere else and ask it a question
        run: |
          pip install dist/*.whl
          mkdir -p /tmp/subject && printf 'def leaf():\n    return 1\ndef mid():\n    return leaf()\n' > /tmp/subject/app.py
          cd /tmp/subject
          codegraph build .
          codegraph impact leaf | tee out.txt
          grep -q "app.mid" out.txt
          codegraph --help > /dev/null
